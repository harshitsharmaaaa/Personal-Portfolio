<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" preserveAspectRatio="xMidYMax meet" role="img" aria-label="Modern metro train at an illuminated night platform">
  <title>Train at the platform</title>
  <desc>A detailed side-view metro train with lit windows, doors, destination signage, headlights, bogies, rails, sleepers and a tactile platform edge, drawn in layered groups.</desc>

  <defs>
    <linearGradient id="bodyPaint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2e9f2"/>
      <stop offset="26%" stop-color="#b9c8dc"/>
      <stop offset="62%" stop-color="#7b90ae"/>
      <stop offset="100%" stop-color="#465b7c"/>
    </linearGradient>
    <linearGradient id="roofPaint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2f6fb"/>
      <stop offset="100%" stop-color="#9aacc6"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#fff0c9"/>
      <stop offset="48%" stop-color="#ffcf8a"/>
      <stop offset="100%" stop-color="#b87847"/>
    </linearGradient>
    <linearGradient id="glassCool" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#cfe4ff"/>
      <stop offset="55%" stop-color="#7fa9d6"/>
      <stop offset="100%" stop-color="#3c587d"/>
    </linearGradient>
    <linearGradient id="livery" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4f8cff"/>
      <stop offset="48%" stop-color="#f05257"/>
      <stop offset="100%" stop-color="#34c78b"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c6d2e2"/>
      <stop offset="45%" stop-color="#66758c"/>
      <stop offset="100%" stop-color="#2b374c"/>
    </linearGradient>
    <linearGradient id="platformFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#26324a"/>
      <stop offset="100%" stop-color="#0a1120"/>
    </linearGradient>
    <radialGradient id="headGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff4d0" stop-opacity="1"/>
      <stop offset="35%" stop-color="#ffd27e" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffb14e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wheel" cx="38%" cy="34%" r="65%">
      <stop offset="0%" stop-color="#506078"/>
      <stop offset="55%" stop-color="#1b2437"/>
      <stop offset="100%" stop-color="#080d19"/>
    </radialGradient>
    <filter id="bodyShadow" x="-20%" y="-40%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="lampBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <pattern id="sleepers" width="54" height="76" patternUnits="userSpaceOnUse" patternTransform="translate(0 266) skewX(-9)">
      <rect x="0" y="8" width="34" height="16" rx="2" fill="#1d283c"/>
      <rect x="0" y="8" width="34" height="3" fill="#394860" opacity="0.8"/>
    </pattern>
    <pattern id="tactile" width="22" height="14" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="5" r="2.6" fill="#ffd05e" opacity="0.85"/>
      <circle cx="17" cy="10" r="2.6" fill="#ffd05e" opacity="0.6"/>
    </pattern>

    <style>
      .train-shell { animation: trainSway 7s ease-in-out infinite; transform-origin: 450px 270px; }
      .cabin-glow { animation: cabinPulse 4.5s ease-in-out infinite alternate; }
      .cabin-glow-b { animation: cabinPulse 5.7s ease-in-out -1.8s infinite alternate; }
      .headlight { animation: headPulse 3.4s ease-in-out infinite alternate; }
      .route-dot { animation: dotPulse 2.8s ease-in-out infinite alternate; }
      .platform-strip { animation: stripShimmer 6s ease-in-out infinite alternate; }
      @keyframes trainSway { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1.6px); } }
      @keyframes cabinPulse { 0% { opacity: 0.72; } 100% { opacity: 1; } }
      @keyframes headPulse { 0% { opacity: 0.65; } 100% { opacity: 1; } }
      @keyframes dotPulse { 0% { opacity: 0.45; } 100% { opacity: 1; } }
      @keyframes stripShimmer { 0% { opacity: 0.45; } 100% { opacity: 0.9; } }
      @media (prefers-reduced-motion: reduce) {
        .train-shell, .cabin-glow, .cabin-glow-b, .headlight, .route-dot, .platform-strip { animation: none; }
      }
    </style>
  </defs>

  <!-- ===================== TRACK BED AND RAILS ===================== -->
  <g id="tracks">
    <path d="M0 288 L900 274 L900 360 L0 360 Z" fill="#111a2d"/>
    <rect x="0" y="276" width="900" height="72" fill="url(#sleepers)" opacity="0.9"/>
    <path d="M0 300 L900 286" stroke="#0a1120" stroke-width="12" fill="none"/>
    <path d="M0 300 L900 286" stroke="url(#rail)" stroke-width="4" fill="none"/>
    <path d="M0 300 L900 286" stroke="#e6eefb" stroke-width="1" fill="none" opacity="0.7"/>
    <path d="M0 328 L900 314" stroke="#0a1120" stroke-width="12" fill="none"/>
    <path d="M0 328 L900 314" stroke="url(#rail)" stroke-width="4" fill="none"/>
    <path d="M0 328 L900 314" stroke="#dbe6f6" stroke-width="1" fill="none" opacity="0.55"/>
    <g fill="#26334b" opacity="0.8">
      <circle cx="36" cy="344" r="2"/><circle cx="96" cy="342" r="1.6"/>
      <circle cx="162" cy="340" r="2.2"/><circle cx="248" cy="338" r="1.8"/>
      <circle cx="332" cy="336" r="2"/><circle cx="416" cy="334" r="1.5"/>
      <circle cx="512" cy="332" r="2.1"/><circle cx="604" cy="330" r="1.7"/>
      <circle cx="704" cy="328" r="2"/><circle cx="812" cy="326" r="1.6"/>
    </g>
  </g>

  <!-- ===================== TRAIN ===================== -->
  <g id="train" class="train-shell">
    <!-- Ground shadow -->
    <ellipse cx="452" cy="286" rx="410" ry="20" fill="#03060e" opacity="0.72" filter="url(#bodyShadow)"/>

    <!-- Undercarriage and bogies -->
    <g id="undercarriage">
      <path d="M92 240 H836 Q 856 240 858 256 L 858 266 H 78 L 78 256 Q 78 240 92 240 Z" fill="#0d1526"/>
      <rect x="156" y="258" width="150" height="22" rx="6" fill="#182238"/>
      <rect x="596" y="258" width="150" height="22" rx="6" fill="#182238"/>
      <g>
        <circle cx="192" cy="274" r="17" fill="url(#wheel)"/>
        <circle cx="192" cy="274" r="7" fill="#5e718d"/>
        <circle cx="192" cy="274" r="2.5" fill="#c7d4e6"/>
        <circle cx="266" cy="274" r="17" fill="url(#wheel)"/>
        <circle cx="266" cy="274" r="7" fill="#5e718d"/>
        <circle cx="266" cy="274" r="2.5" fill="#c7d4e6"/>
        <circle cx="632" cy="274" r="17" fill="url(#wheel)"/>
        <circle cx="632" cy="274" r="7" fill="#5e718d"/>
        <circle cx="632" cy="274" r="2.5" fill="#c7d4e6"/>
        <circle cx="706" cy="274" r="17" fill="url(#wheel)"/>
        <circle cx="706" cy="274" r="7" fill="#5e718d"/>
        <circle cx="706" cy="274" r="2.5" fill="#c7d4e6"/>
      </g>
      <rect x="330" y="262" width="210" height="10" rx="3" fill="#24314b"/>
      <rect x="350" y="264" width="52" height="6" rx="2" fill="#3d4d69"/>
      <rect x="420" y="264" width="52" height="6" rx="2" fill="#3d4d69"/>
    </g>

    <!-- Main shell -->
    <g id="body">
      <path d="M106 84 L828 84 Q 864 84 872 116 L 872 224 Q 872 250 846 250 L 96 250 Q 40 250 34 212 L 30 138 Q 28 96 106 84 Z" fill="url(#bodyPaint)"/>
      <path d="M106 84 L828 84 Q 858 84 868 112 L 58 112 Q 46 92 106 84 Z" fill="url(#roofPaint)" opacity="0.92"/>
      <!-- Roof equipment -->
      <rect x="300" y="76" width="94" height="10" rx="4" fill="#647994"/>
      <rect x="312" y="72" width="66" height="6" rx="3" fill="#91a5bf"/>
      <rect x="612" y="76" width="80" height="10" rx="4" fill="#647994"/>
      <rect x="624" y="72" width="54" height="6" rx="3" fill="#91a5bf"/>
      <rect x="760" y="78" width="46" height="8" rx="3" fill="#6e83a0"/>
      <!-- Body seams -->
      <g stroke="#5f7493" stroke-width="1.2" opacity="0.6" fill="none">
        <path d="M134 86 V246 M280 86 V246 M412 86 V246 M492 86 V246 M696 86 V246 M840 86 V246"/>
      </g>
      <!-- Livery stripe across the three route colours -->
      <path d="M36 190 Q 40 186 48 186 H 866 V 198 H 46 Q 38 198 36 194 Z" fill="url(#livery)" opacity="0.92"/>
      <path d="M36 190 Q 40 186 48 186 H 866" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.45"/>
      <!-- Lower skirt -->
      <path d="M36 214 Q 40 250 96 250 H 846 Q 872 250 872 224 V 216 Z" fill="#3b4f6e" opacity="0.9"/>
      <path d="M96 246 H 846" stroke="#263750" stroke-width="2"/>
      <!-- Reflected light along the roofline -->
      <path d="M108 88 H 826" stroke="#ffffff" stroke-width="2" opacity="0.55"/>
    </g>

    <!-- Windows: warm illuminated interiors -->
    <g id="windows" stroke="#40536f" stroke-width="2.5">
      <!-- Driver windshield, angled -->
      <path class="cabin-glow" d="M48 110 H 122 L 112 172 H 58 Z" fill="url(#glassCool)"/>
      <path class="cabin-glow" d="M48 110 H 122 L 112 172 H 58 Z" fill="url(#glass)" opacity="0.28"/>
      <path d="M84 110 L 80 172 M50 138 H 118" stroke="#b9cbe0" stroke-width="1" opacity="0.45"/>
      <!-- Passenger windows -->
      <g class="cabin-glow">
        <rect x="142" y="110" width="58" height="62" rx="5" fill="url(#glass)"/>
        <rect x="282" y="110" width="58" height="62" rx="5" fill="url(#glass)"/>
        <rect x="352" y="110" width="58" height="62" rx="5" fill="url(#glass)"/>
      </g>
      <g class="cabin-glow-b">
        <rect x="494" y="110" width="58" height="62" rx="5" fill="url(#glass)"/>
        <rect x="564" y="110" width="58" height="62" rx="5" fill="url(#glass)"/>
        <rect x="634" y="110" width="58" height="62" rx="5" fill="url(#glass)"/>
        <rect x="708" y="110" width="58" height="62" rx="5" fill="url(#glass)"/>
        <rect x="778" y="110" width="58" height="62" rx="5" fill="url(#glass)"/>
      </g>
      <!-- Seat silhouettes and interior hints -->
      <g fill="#8b5a37" opacity="0.35">
        <rect x="152" y="148" width="12" height="18" rx="3"/>
        <rect x="176" y="148" width="12" height="18" rx="3"/>
        <rect x="292" y="148" width="12" height="18" rx="3"/>
        <rect x="316" y="148" width="12" height="18" rx="3"/>
        <rect x="504" y="148" width="12" height="18" rx="3"/>
        <rect x="528" y="148" width="12" height="18" rx="3"/>
        <rect x="644" y="148" width="12" height="18" rx="3"/>
        <rect x="668" y="148" width="12" height="18" rx="3"/>
        <rect x="788" y="148" width="12" height="18" rx="3"/>
      </g>
      <!-- Window highlights -->
      <g stroke="#fff6e2" stroke-width="1.4" opacity="0.5" fill="none">
        <path d="M146 116 H 178 M286 116 H 318 M356 116 H 388 M498 116 H 530 M568 116 H 600 M638 116 H 670 M712 116 H 744 M782 116 H 814"/>
      </g>
    </g>

    <!-- Double sliding doors with glass panels and handles -->
    <g id="doors">
      <g transform="translate(206 0)">
        <rect x="0" y="104" width="62" height="140" rx="4" fill="#6e829f" stroke="#3d506d" stroke-width="2"/>
        <rect x="3" y="108" width="27" height="132" rx="2" fill="#90a4bf"/>
        <rect x="32" y="108" width="27" height="132" rx="2" fill="#8096b3"/>
        <rect class="cabin-glow" x="7" y="114" width="19" height="54" rx="3" fill="url(#glass)"/>
        <rect class="cabin-glow-b" x="36" y="114" width="19" height="54" rx="3" fill="url(#glass)"/>
        <path d="M31 104 V244" stroke="#334764" stroke-width="2"/>
        <rect x="26" y="176" width="3" height="22" rx="1.5" fill="#2d3e59"/>
        <rect x="33" y="176" width="3" height="22" rx="1.5" fill="#2d3e59"/>
      </g>
      <g transform="translate(424 0)">
        <rect x="0" y="104" width="62" height="140" rx="4" fill="#6e829f" stroke="#3d506d" stroke-width="2"/>
        <rect x="3" y="108" width="27" height="132" rx="2" fill="#90a4bf"/>
        <rect x="32" y="108" width="27" height="132" rx="2" fill="#8096b3"/>
        <rect class="cabin-glow-b" x="7" y="114" width="19" height="54" rx="3" fill="url(#glass)"/>
        <rect class="cabin-glow" x="36" y="114" width="19" height="54" rx="3" fill="url(#glass)"/>
        <path d="M31 104 V244" stroke="#334764" stroke-width="2"/>
        <rect x="26" y="176" width="3" height="22" rx="1.5" fill="#2d3e59"/>
        <rect x="33" y="176" width="3" height="22" rx="1.5" fill="#2d3e59"/>
      </g>
    </g>

    <!-- Destination signage and front detailing -->
    <g id="signage">
      <rect x="140" y="92" width="154" height="16" rx="3" fill="#111c31"/>
      <text x="150" y="104" fill="#ffd06e" font-family="ui-monospace, monospace" font-size="10" letter-spacing="1.4">CENTRAL 01  →</text>
      <rect x="806" y="92" width="46" height="16" rx="3" fill="#111c31"/>
      <text x="813" y="104" fill="#a9e5c4" font-family="ui-monospace, monospace" font-size="10" letter-spacing="1">LINE 3</text>
      <!-- Route identity squares -->
      <rect x="140" y="210" width="8" height="8" rx="2" fill="#4f8cff"/>
      <rect x="152" y="210" width="8" height="8" rx="2" fill="#f05257"/>
      <rect x="164" y="210" width="8" height="8" rx="2" fill="#34c78b"/>
    </g>

    <!-- Headlights and marker lights -->
    <g id="lights">
      <ellipse class="headlight" cx="52" cy="204" rx="34" ry="22" fill="url(#headGlow)" filter="url(#lampBlur)"/>
      <ellipse cx="52" cy="204" rx="9" ry="7" fill="#fff6d8"/>
      <ellipse cx="52" cy="204" rx="4" ry="3" fill="#ffffff"/>
      <circle class="headlight" cx="48" cy="232" r="4" fill="#ff8a72"/>
      <circle class="headlight" cx="64" cy="232" r="4" fill="#ff8a72"/>
      <circle cx="858" cy="204" r="5" fill="#ff8a72" opacity="0.85"/>
      <circle cx="858" cy="224" r="5" fill="#ff8a72" opacity="0.7"/>
    </g>
  </g>

  <!-- ===================== PLATFORM AND STOPS ===================== -->
  <g id="platform">
    <path d="M0 322 L900 308 L900 360 L0 360 Z" fill="url(#platformFace)"/>
    <path d="M0 322 L900 308" stroke="#93a4bd" stroke-width="2" opacity="0.7" fill="none"/>
    <path class="platform-strip" d="M0 326 L900 312 L900 324 L0 338 Z" fill="url(#tactile)"/>
    <path d="M0 340 L900 326" stroke="#0a1120" stroke-width="3" opacity="0.9"/>
    <!-- Platform columns receding into the distance -->
    <g opacity="0.55">
      <rect x="86" y="322" width="9" height="38" fill="#1c2740"/>
      <rect x="330" y="319" width="9" height="41" fill="#1c2740"/>
      <rect x="574" y="316" width="9" height="44" fill="#1c2740"/>
      <rect x="818" y="313" width="9" height="47" fill="#1c2740"/>
    </g>
    <!-- Interactive stop markers are rendered as accessible HTML buttons over
         the platform by StationStops, so the SVG stays free of duplicates. -->
  </g>
</svg>
